<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 690" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
    <marker id="aM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C026D3"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <g id="pe-row">
      <g stroke="#2563EB" stroke-width="2"><line x1="474" y1="0" x2="500" y2="0"/><line x1="554" y1="0" x2="580" y2="0"/><line x1="634" y1="0" x2="660" y2="0"/></g>
      <g stroke="#C026D3" stroke-width="2"><line x1="447" y1="18" x2="447" y2="26"/><line x1="527" y1="18" x2="527" y2="26"/><line x1="607" y1="18" x2="607" y2="26"/><line x1="687" y1="18" x2="687" y2="26"/></g>
      <g fill="#fff" stroke="#7C3AED" stroke-width="1.5">
        <rect x="420" y="-18" width="54" height="36" rx="6"/><rect x="500" y="-18" width="54" height="36" rx="6"/>
        <rect x="580" y="-18" width="54" height="36" rx="6"/><rect x="660" y="-18" width="54" height="36" rx="6"/>
      </g>
      <g font-size="12" fill="#4C1D95" text-anchor="middle"><text x="447" y="4">PE</text><text x="527" y="4">PE</text><text x="607" y="4">PE</text><text x="687" y="4">PE</text></g>
    </g>
  </defs>
  <rect width="980" height="690" fill="#F8FAFC"/>
  <text x="30" y="42" font-size="26" font-weight="700" fill="#1E293B">TinyTPU block diagram</text>
  <text x="30" y="66" font-size="14" fill="#475569">Same blocks as Google's TPU v1, shrunk from a 256 x 256 array to 4 x 4. Colors match every other diagram in this repo.</text>

  <!-- top row -->
  <rect x="30" y="100" width="170" height="70" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <text x="115" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#1E293B">Host computer</text>
  <text x="115" y="152" text-anchor="middle" font-size="12" fill="#475569">loads program + data</text>
  <rect x="245" y="100" width="190" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="340" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">Instruction memory</text>
  <text x="340" y="152" text-anchor="middle" font-size="12" fill="#475569">LDW, MMUL, ACT, HALT</text>
  <rect x="480" y="100" width="180" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="570" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#1E293B">Controller</text>
  <text x="570" y="152" text-anchor="middle" font-size="12" fill="#475569">fetch, decode, sequence</text>
  <line x1="200" y1="135" x2="241" y2="135" stroke="#64748B" stroke-width="2.5" marker-end="url(#aS)"/>
  <line x1="435" y1="135" x2="476" y2="135" stroke="#64748B" stroke-width="2.5" marker-end="url(#aS)"/>
  <path d="M660 135 H 950 V 650" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="936" y="330" font-size="12" fill="#64748B" text-anchor="middle" transform="rotate(-90 936 330)">control signals to every block</text>

  <!-- legend -->
  <g font-size="12" fill="#334155">
    <rect x="720" y="186" width="180" height="96" rx="8" fill="#fff" stroke="#CBD5E1"/>
    <line x1="734" y1="207" x2="762" y2="207" stroke="#2563EB" stroke-width="4"/><text x="772" y="211">activations (inputs)</text>
    <line x1="734" y1="229" x2="762" y2="229" stroke="#D97706" stroke-width="4"/><text x="772" y="233">weights</text>
    <line x1="734" y1="251" x2="762" y2="251" stroke="#C026D3" stroke-width="4"/><text x="772" y="255">partial sums</text>
    <line x1="734" y1="273" x2="762" y2="273" stroke="#059669" stroke-width="4"/><text x="772" y="277">finished outputs</text>
  </g>

  <!-- weight memory -->
  <rect x="470" y="200" width="200" height="62" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="570" y="227" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">Weight memory</text>
  <text x="570" y="247" text-anchor="middle" font-size="12" fill="#92400E">TPU v1: 8 GiB DDR3, off-chip</text>
  <line x1="570" y1="262" x2="570" y2="300" stroke="#D97706" stroke-width="3" marker-end="url(#aA)"/>
  <text x="560" y="287" font-size="12" fill="#B45309" font-weight="700" text-anchor="end">weights enter at the top</text>

  <!-- unified buffer -->
  <rect x="30" y="310" width="200" height="130" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="130" y="345" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">Unified Buffer</text>
  <text x="130" y="367" text-anchor="middle" font-size="12" fill="#1E3A8A">int8 activation vectors</text>
  <text x="130" y="387" text-anchor="middle" font-size="12" fill="#1E3A8A">TPU v1: 24 MiB SRAM</text>
  <text x="130" y="418" text-anchor="middle" font-size="12" fill="#1E3A8A">inputs in, results back</text>
  <line x1="115" y1="170" x2="115" y2="306" stroke="#64748B" stroke-width="2.5" marker-end="url(#aS)"/>

  <!-- skew -->
  <rect x="265" y="330" width="70" height="90" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="300" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">skew</text>
  <path d="M278 402 h10 v-10 h10 v-10 h10 v-10 h10" stroke="#2563EB" stroke-width="2" fill="none"/>
  <line x1="230" y1="375" x2="261" y2="375" stroke="#2563EB" stroke-width="3" marker-end="url(#aB)"/>
  <line x1="335" y1="375" x2="376" y2="375" stroke="#2563EB" stroke-width="3" marker-end="url(#aB)"/>

  <!-- systolic array -->
  <rect x="380" y="304" width="380" height="250" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="3"/>
  <text x="570" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#4C1D95">Matrix Multiply Unit (systolic array)</text>
  <use href="#pe-row" y="365"/><use href="#pe-row" y="409"/><use href="#pe-row" y="453"/><use href="#pe-row" y="497"/>
  <text x="570" y="542" text-anchor="middle" font-size="12" fill="#4C1D95">TPU v1: 256 x 256 = 65,536 multiply-accumulate cells</text>

  <!-- accumulators -->
  <line x1="570" y1="554" x2="570" y2="582" stroke="#C026D3" stroke-width="3" marker-end="url(#aM)"/>
  <rect x="455" y="585" width="240" height="66" rx="10" fill="#FAE8FF" stroke="#C026D3" stroke-width="2.5"/>
  <text x="575" y="613" text-anchor="middle" font-size="15" font-weight="700" fill="#86198F">de-skew + Accumulators</text>
  <text x="575" y="634" text-anchor="middle" font-size="12" fill="#86198F">int32 sums (TPU v1: 4 MiB)</text>

  <!-- activation -->
  <rect x="230" y="585" width="190" height="66" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
  <text x="325" y="613" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">Activation unit</text>
  <text x="325" y="634" text-anchor="middle" font-size="12" fill="#065F46">ReLU, shift, clamp to int8</text>
  <line x1="470" y1="618" x2="424" y2="618" stroke="#C026D3" stroke-width="3" marker-end="url(#aM)"/>
  <path d="M230 618 H 130 V 444" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#aG)"/>
  <text x="142" y="500" font-size="12" font-weight="700" fill="#059669">results become</text>
  <text x="142" y="516" font-size="12" font-weight="700" fill="#059669">the next layer's inputs</text>
</svg>
