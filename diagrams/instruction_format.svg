<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="470" fill="#F8FAFC"/>
  <text x="30" y="42" font-size="26" font-weight="700" fill="#1E293B">TinyTPU instruction word (32 bits)</text>
  <text x="30" y="66" font-size="14" fill="#475569">One fixed format for every instruction. The controller slices it into five fields.</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#64748B" text-anchor="middle">
    <text x="45" y="102">31</text><text x="135" y="102">28</text><text x="160" y="102">27</text><text x="355" y="102">20</text>
    <text x="380" y="102">19</text><text x="575" y="102">12</text><text x="600" y="102">11</text><text x="795" y="102">4</text>
    <text x="820" y="102">3</text><text x="915" y="102">0</text>
  </g>
  <rect x="30"  y="110" width="120" height="70" fill="#E2E8F0" stroke="#1E293B" stroke-width="2"/>
  <rect x="150" y="110" width="220" height="70" fill="#DBEAFE" stroke="#1E293B" stroke-width="2"/>
  <rect x="370" y="110" width="220" height="70" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/>
  <rect x="590" y="110" width="220" height="70" fill="#FAE8FF" stroke="#1E293B" stroke-width="2"/>
  <rect x="810" y="110" width="120" height="70" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/>
  <g font-size="18" font-weight="700" text-anchor="middle" fill="#1E293B">
    <text x="90" y="152">opcode</text><text x="260" y="152">A</text><text x="480" y="152">B</text><text x="700" y="152">C</text><text x="870" y="152">flags</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#475569">
    <text x="90" y="200">4 bits</text><text x="260" y="200">8 bits: source address</text><text x="480" y="200">8 bits: row count</text><text x="700" y="200">8 bits: destination</text><text x="870" y="200">4 bits</text>
  </g>
  <g font-size="14" fill="#1E293B">
    <rect x="30" y="230" width="900" height="210" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <g font-weight="700"><text x="50" y="262">opcode</text><text x="140" y="262">name</text><text x="230" y="262">what it does</text><text x="720" y="262">example</text></g>
    <line x1="45" y1="272" x2="915" y2="272" stroke="#CBD5E1"/>
    <g font-family="Consolas, Menlo, monospace" font-size="13">
      <text x="50" y="298">0x1</text><text x="140" y="298" fill="#B45309" font-weight="700">LDW</text>
      <text x="50" y="330">0x2</text><text x="140" y="330" fill="#7C3AED" font-weight="700">MMUL</text>
      <text x="50" y="362">0x3</text><text x="140" y="362" fill="#059669" font-weight="700">ACT</text>
      <text x="50" y="394">0x0</text><text x="140" y="394" fill="#64748B" font-weight="700">NOP</text>
      <text x="50" y="426">0xF</text><text x="140" y="426" fill="#64748B" font-weight="700">HALT</text>
      <text x="720" y="298">LDW w=0</text>
      <text x="720" y="330">MMUL ub=0 rows=8 acc=0</text>
      <text x="720" y="362">ACT acc=0 rows=8 ub=16</text>
      <text x="720" y="394">NOP</text>
      <text x="720" y="426">HALT</text>
    </g>
    <text x="230" y="298">load a 4 x 4 weight tile from weight memory [A..A+3]</text>
    <text x="230" y="330">stream B vectors from Unified Buffer [A..] into acc [C..]</text>
    <text x="230" y="362">activate B acc rows [A..], write int8 to buffer [C..]</text>
    <text x="230" y="394">do nothing for one instruction</text>
    <text x="230" y="426">stop and raise the done signal</text>
  </g>
</svg>
