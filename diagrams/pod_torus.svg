<text x="580.0" y="170.0" font-size="15" fill="#1E293B" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Why a torus?</text>
<text x="580.0" y="196.0" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Big models are split across chips, and each</text>
<text x="580.0" y="220.0" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">step, chips swap slices of activations and</text>
<text x="580.0" y="244.0" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">gradients with neighbors.</text>
<text x="580.0" y="268.0" font-size="6" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif"></text>
<text x="580.0" y="285.0" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Wrap-around links halve the worst-case</text>
<text x="580.0" y="309.0" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">distance across the grid.</text>
<text x="580.0" y="333.0" font-size="6" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif"></text>
<text x="580.0" y="350.0" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">TPU v4 adds optical circuit switches that</text>
<text x="580.0" y="374.0" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">rewire groups of 64 chips into different</text>
<text x="580.0" y="398.0" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">3-D shapes on demand.</text>
</svg>
