<text x="30.0" y="42.0" font-size="26" fill="#1E293B" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Scaling out: chips wired into a torus (a TPU pod)</text>
<text x="30.0" y="68.0" font-size="14" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Each chip talks only to its neighbors through the Inter-Chip Interconnect (ICI), a systolic idea at building</text>
<text x="30.0" y="88.0" font-size="14" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">scale. Edges wrap around, so the grid has no ends. TPU v2/v3 pods: 2-D torus. TPU v4 onward: 3-D torus.</text>
