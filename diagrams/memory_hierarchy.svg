<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="aM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C026D3"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs>
<rect width="980" height="520" fill="#F8FAFC"/>
<text x="30.0" y="42.0" font-size="26" fill="#1E293B" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Memory hierarchy: big and slow below, tiny and fast on top</text>
<text x="30.0" y="68.0" font-size="14" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The systolic array only works if data flows up this pyramid fast enough. TPU v1 numbers vs TinyTPU.</text>
<path d="M310 180 L345 110 L455 110 L490 180 Z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="400.0" y="140.0" font-size="14" fill="#4C1D95" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">PE registers</text>
<text x="400.0" y="160.0" font-size="12" fill="#4C1D95" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">TPU v1: 65,536 PEs</text>
<text x="760.0" y="152.0" font-size="13" fill="#475569" font-weight="600" text-anchor="start" font-family="Consolas, Menlo, monospace">4 x 4 PEs</text>
<path d="M240 258 L275 188 L525 188 L560 258 Z" fill="#FAE8FF" stroke="#C026D3" stroke-width="2"/>
<text x="400.0" y="218.0" font-size="14" fill="#86198F" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Accumulators (SRAM)</text>
<text x="400.0" y="238.0" font-size="12" fill="#86198F" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">TPU v1: 4 MiB</text>
<text x="760.0" y="230.0" font-size="13" fill="#475569" font-weight="600" text-anchor="start" font-family="Consolas, Menlo, monospace">256 x 4 x 32 bit</text>
<path d="M170 336 L205 266 L595 266 L630 336 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="400.0" y="296.0" font-size="14" fill="#1E3A8A" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Unified Buffer (SRAM)</text>
<text x="400.0" y="316.0" font-size="12" fill="#1E3A8A" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">TPU v1: 24 MiB</text>
<text x="760.0" y="308.0" font-size="13" fill="#475569" font-weight="600" text-anchor="start" font-family="Consolas, Menlo, monospace">256 x 4 bytes</text>
<path d="M100 414 L135 344 L665 344 L700 414 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="400.0" y="374.0" font-size="14" fill="#92400E" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Weight memory (DDR3 DRAM, off-chip)</text>
<text x="400.0" y="394.0" font-size="12" fill="#92400E" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">TPU v1: 8 GiB @ 34 GB/s</text>
<text x="760.0" y="386.0" font-size="13" fill="#475569" font-weight="600" text-anchor="start" font-family="Consolas, Menlo, monospace">256 x 4 bytes</text>
<path d="M30 492 L65 422 L735 422 L770 492 Z" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
<text x="400.0" y="452.0" font-size="14" fill="#1E293B" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Host server memory (over PCIe)</text>
<text x="400.0" y="472.0" font-size="12" fill="#1E293B" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">TPU v1: the whole datacenter server</text>
<text x="760.0" y="464.0" font-size="13" fill="#475569" font-weight="600" text-anchor="start" font-family="Consolas, Menlo, monospace">testbench $readmemh</text>
<text x="760.0" y="96.0" font-size="14" fill="#1E293B" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">TinyTPU</text>
<line x1="930.0" y1="480.0" x2="930.0" y2="120.0" stroke="#059669" stroke-width="3" marker-end="url(#aG)"/>
<text x="945.0" y="300.0" font-size="12" fill="#059669" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" transform="rotate(-90 945 300)">faster, closer, more energy-efficient</text>
</svg>
