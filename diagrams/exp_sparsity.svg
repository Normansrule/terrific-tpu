<rect width="1000" height="530" fill="#F8FAFC"/>
<text x="30.0" y="42.0" font-size="26" fill="#1E293B" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Experiment 6: how much work is multiplying by zero?</text>
<text x="30.0" y="68.0" font-size="14" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Every multiply-accumulate each application performs on the instruction-level model, split by whether an operand</text>
<text x="30.0" y="88.0" font-size="14" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">was zero. A dense array does them all anyway; sparse accelerators skip them.</text>
<text x="186.0" y="144.0" font-size="14" fill="#1E293B" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif">Neural net</text>
