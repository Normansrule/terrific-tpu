<text x="250.0" y="488.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">both zero</text>
<text x="430.0" y="425.0" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Graphs are mostly zeros; that is why graph analytics needs sparse hardware.</text>
