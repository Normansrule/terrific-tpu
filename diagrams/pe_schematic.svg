<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
    <marker id="aM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C026D3"/></marker>
  </defs>
  <rect width="960" height="560" fill="#F8FAFC"/>
  <text x="30" y="42" font-size="26" font-weight="700" fill="#1E293B">Inside one Processing Element (PE)</text>
  <text x="30" y="66" font-size="14" fill="#475569">Register-level schematic of rtl/v1_simple/pe.v. Three flip-flop registers, one multiplier, one adder. That is the whole cell.</text>

  <!-- PE boundary -->
  <rect x="170" y="108" width="560" height="387" rx="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="712" y="130" text-anchor="end" font-size="13" fill="#7C3AED" font-weight="700">pe.v</text>

  <!-- weight register -->
  <line x1="400" y1="80" x2="400" y2="128" stroke="#D97706" stroke-width="3" marker-end="url(#aA)"/>
  <text x="410" y="92" font-size="13" fill="#B45309" font-weight="700">w_in (from PE above)</text>
  <rect x="325" y="130" width="150" height="50" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="400" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">weight reg</text>
  <text x="400" y="170" text-anchor="middle" font-size="11" fill="#92400E">load when w_load=1</text>
  <path d="M333 180 l8 -8 l8 8" fill="none" stroke="#92400E" stroke-width="1.5"/>
  <line x1="400" y1="180" x2="400" y2="232" stroke="#D97706" stroke-width="3" marker-end="url(#aA)"/>
  <path d="M475 155 H 600 V 520" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#aA)"/>
  <text x="610" y="530" font-size="13" fill="#B45309" font-weight="700">w_out (to PE below)</text>

  <!-- activation in -->
  <line x1="40" y1="258" x2="370" y2="258" stroke="#2563EB" stroke-width="3" marker-end="url(#aB)"/>
  <text x="40" y="248" font-size="13" fill="#1D4ED8" font-weight="700">a_in (from left)</text>
  <circle cx="250" cy="258" r="5" fill="#2563EB"/>
  <path d="M250 258 V 462 H 525 V 438" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB)"/>

  <!-- multiplier -->
  <circle cx="400" cy="258" r="26" fill="#EFF6FF" stroke="#1E293B" stroke-width="2.5"/>
  <text x="400" y="267" text-anchor="middle" font-size="28" fill="#1E293B">×</text>
  <text x="440" y="240" font-size="12" fill="#475569">8 x 8 bit signed multiply</text>
  <line x1="400" y1="284" x2="400" y2="316" stroke="#C026D3" stroke-width="3" marker-end="url(#aM)"/>

  <!-- p in -->
  <line x1="260" y1="100" x2="260" y2="110" stroke="#C026D3" stroke-width="0"/>
  <path d="M120 342 H 370" fill="none" stroke="#C026D3" stroke-width="3" marker-end="url(#aM)"/>
  <text x="40" y="332" font-size="13" fill="#A21CAF" font-weight="700">p_in (partial sum from PE above)</text>

  <!-- adder -->
  <circle cx="400" cy="342" r="26" fill="#FAE8FF" stroke="#1E293B" stroke-width="2.5"/>
  <text x="400" y="352" text-anchor="middle" font-size="28" fill="#1E293B">+</text>
  <text x="440" y="336" font-size="12" fill="#475569">32-bit add</text>
  <line x1="400" y1="368" x2="400" y2="386" stroke="#C026D3" stroke-width="3" marker-end="url(#aM)"/>

  <!-- p_out register -->
  <rect x="345" y="388" width="110" height="46" rx="6" fill="#FAE8FF" stroke="#C026D3" stroke-width="2.5"/>
  <text x="400" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#86198F">p_out reg</text>
  <path d="M353 434 l8 -8 l8 8" fill="none" stroke="#86198F" stroke-width="1.5"/>
  <line x1="400" y1="434" x2="400" y2="520" stroke="#C026D3" stroke-width="3" marker-end="url(#aM)"/>
  <text x="250" y="535" font-size="13" fill="#A21CAF" font-weight="700">p_out (to PE below)</text>

  <!-- a_out register -->
  <rect x="475" y="388" width="100" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="525" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A8A">a_out reg</text>
  <path d="M483 434 l8 -8 l8 8" fill="none" stroke="#1E3A8A" stroke-width="1.5"/>
  <path d="M575 410 H 690 V 258 H 930" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#aB)"/>
  <text x="770" y="248" font-size="13" fill="#1D4ED8" font-weight="700">a_out (to right)</text>

  <!-- clock -->
  <text x="190" y="488" font-size="12" fill="#64748B">▷ = rising-edge flip-flop (all share clk)</text>
  <!-- equation -->
  <rect x="745" y="300" width="200" height="92" rx="10" fill="#1E293B"/>
  <text x="845" y="328" text-anchor="middle" font-size="13" fill="#CBD5E1">every clock tick:</text>
  <text x="845" y="354" text-anchor="middle" font-size="14" fill="#F0ABFC" font-family="Consolas, monospace">p_out = p_in + a·w</text>
  <text x="845" y="378" text-anchor="middle" font-size="14" fill="#93C5FD" font-family="Consolas, monospace">a_out = a_in</text>
</svg>
