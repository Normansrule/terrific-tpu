<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="aM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C026D3"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs>
<rect width="980" height="330" fill="#F8FAFC"/>
<text x="30.0" y="42.0" font-size="26" fill="#1E293B" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Where TPU v1 spent its silicon</text>
<text x="30.0" y="68.0" font-size="14" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Share of die area, from the floor plan in Jouppi et al., ISCA 2017 (Figure 2). Control logic is only ~2 %.</text>
<text x="30.0" y="88.0" font-size="14" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">A CPU spends a large share on control and caches; the TPU spends most of it on math and on-chip memory.</text>
<rect x="40.0" y="130.0" width="259.0" height="70.0" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="170.5" y="162.0" font-size="14" fill="#1E3A8A" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Unified Buffer</text>
<text x="170.5" y="182.0" font-size="13" fill="#1E3A8A" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">29 %</text>
<rect x="301.0" y="130.0" width="214.0" height="70.0" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="409.0" y="162.0" font-size="14" fill="#4C1D95" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Matrix Multiply Unit</text>
<text x="409.0" y="182.0" font-size="13" fill="#4C1D95" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">24 %</text>
<rect x="517.0" y="130.0" width="16.0" height="70.0" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
<text x="526.0" y="172.0" font-size="11" fill="#DC2626" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">2%</text>
<line x1="526.0" y1="202.0" x2="526.0" y2="230.0" stroke="#DC2626" stroke-width="1.5"/>
<text x="526.0" y="246.0" font-size="12" fill="#DC2626" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Control</text>
<rect x="535.0" y="130.0" width="403.0" height="70.0" rx="6" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
<text x="737.5" y="162.0" font-size="14" fill="#1E293B" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">everything else</text>
<text x="737.5" y="182.0" font-size="13" fill="#1E293B" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">45 %</text>
<text x="40.0" y="270.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">"Everything else" = accumulators, activation pipeline, DRAM ports, PCIe and host interfaces, and I/O.</text>
<text x="40.0" y="292.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Roughly half the die is the Unified Buffer plus the Matrix Multiply Unit. See the paper for the exact floor plan.</text>
</svg>
