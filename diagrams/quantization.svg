<text x="100.0" y="475.0" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">scale = max|value| / 127.   Error per value ≤ scale / 2.   Networks shrug this off; that is why TPUs use 8-bit and bfloat16.</text>
