<text x="30.0" y="42.0" font-size="26" fill="#1E293B" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The roofline: is a workload limited by math or by memory?</text>
<text x="30.0" y="68.0" font-size="14" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Attainable performance = min(peak compute, bandwidth x arithmetic intensity). Log-log axes.</text>
<text x="30.0" y="88.0" font-size="14" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Points: n x n x n int8 matrix multiplies (ops = 2n³, bytes = 3n²) on TPU v1's 34 GB/s weight memory.</text>
