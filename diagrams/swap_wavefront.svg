<path d="M 60 470 L 560 120" stroke="#C026D3" stroke-width="3" fill="none" stroke-dasharray="8 6"/>
<text x="560.0" y="110.0" font-size="13" fill="#C026D3" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif">swap wavefront (moves one diagonal per cycle)</text>
<rect x="580.0" y="140.0" width="370.0" height="330.0" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="600.0" y="170.0" font-size="15" fill="#1E293B" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Why it works</text>
<text x="600.0" y="195.0" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Vector v is in PE(row k, col n) at cycle v+k+n.</text>
<text x="600.0" y="218.0" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The swap flag travels WITH vector 0, so PE(k,n)</text>
<text x="600.0" y="241.0" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">swaps exactly when that vector arrives.</text>
<text x="600.0" y="264.0" font-size="8" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif"></text>
<text x="600.0" y="282.0" font-size="15" fill="#1E293B" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The hazard</text>
<text x="600.0" y="307.0" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The next LDW rewrites the shadow registers.</text>
<text x="600.0" y="330.0" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">It must wait until the wave reaches the last</text>
<text x="600.0" y="353.0" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">PE: 2N-2 cycles. v2's controller counts this</text>
<text x="600.0" y="376.0" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">(swap_wait) and stalls LDW if needed.</text>
<text x="600.0" y="399.0" font-size="8" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif"></text>
<text x="600.0" y="417.0" font-size="13" fill="#DC2626" font-weight="600" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Two mutants in tools/mutation_test.sh break</text>
<text x="600.0" y="440.0" font-size="13" fill="#DC2626" font-weight="600" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">this rule. The random-program tests catch both.</text>
