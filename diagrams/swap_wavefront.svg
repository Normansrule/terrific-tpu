<text x="30.0" y="42.0" font-size="26" fill="#1E293B" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">v2: the swap wavefront (double-buffered weights)</text>
<text x="30.0" y="68.0" font-size="14" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Snapshot 3 cycles into a new MMUL. The swap flag rides with the first new vector, so PEs it has reached</text>
<text x="30.0" y="88.0" font-size="14" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">already use the NEW weights (green) while PEs behind it still finish the OLD vectors (amber).</text>
