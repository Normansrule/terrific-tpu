<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="aM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C026D3"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs>
<rect width="980" height="560" fill="#F8FAFC"/>
<text x="30.0" y="42.0" font-size="26" fill="#1E293B" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Controller state machine (v1, and what v2 adds)</text>
<text x="30.0" y="68.0" font-size="14" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Circles are states. Arrows show what happens at a clock edge. Dashed red = v2's stall loop (hazard check).</text>
<path d="M252 300 Q313 300 374 300" stroke="#64748B" stroke-width="2.2" fill="none" marker-end="url(#aS)"/>
<text x="313.0" y="294.0" font-size="12" fill="#64748B" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">pc = pc + 1</text>
<path d="M476 276 Q573 226 670 176" stroke="#D97706" stroke-width="2.2" fill="none" marker-end="url(#aA)"/>
<text x="573.2" y="219.9" font-size="12" fill="#D97706" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">opcode 1</text>
<path d="M482 300 Q593 300 704 300" stroke="#7C3AED" stroke-width="2.2" fill="none" marker-end="url(#aV)"/>
<text x="593.0" y="294.0" font-size="12" fill="#7C3AED" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">opcode 2</text>
<path d="M476 324 Q573 374 670 424" stroke="#059669" stroke-width="2.2" fill="none" marker-end="url(#aG)"/>
<text x="573.2" y="368.1" font-size="12" fill="#059669" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">opcode 3</text>
<path d="M430 352 Q430 388 430 424" stroke="#DC2626" stroke-width="2.2" fill="none" marker-end="url(#aR)"/>
<text x="430.0" y="382.0" font-size="12" fill="#DC2626" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">opcode F</text>
<path d="M670 164 Q440 148 254 284" stroke="#64748B" stroke-width="2.2" fill="none" marker-end="url(#aS)"/>
<text x="439.7" y="141.6" font-size="12" fill="#64748B" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">done loading</text>
<path d="M708 300 Q482 340 256 300" stroke="#64748B" stroke-width="2.2" fill="none" marker-end="url(#aS)"/>
<text x="482.0" y="334.0" font-size="12" fill="#64748B" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"></text>
<path d="M670 436 Q440 452 254 316" stroke="#64748B" stroke-width="2.2" fill="none" marker-end="url(#aS)"/>
<text x="439.7" y="446.4" font-size="12" fill="#64748B" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">done</text>
<circle cx="200.0" cy="300.0" r="50" fill="#E2E8F0" stroke="#64748B" stroke-width="3"/>
<text x="200.0" y="302.0" font-size="16" fill="#1E293B" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">FETCH</text>
<text x="200.0" y="320.0" font-size="10" fill="#475569" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">ir = imem[pc]</text>
<circle cx="430.0" cy="300.0" r="50" fill="#E2E8F0" stroke="#64748B" stroke-width="3"/>
<text x="430.0" y="302.0" font-size="16" fill="#1E293B" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">DECODE</text>
<text x="430.0" y="320.0" font-size="10" fill="#475569" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">look at opcode</text>
<circle cx="720.0" cy="150.0" r="50" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
<text x="720.0" y="152.0" font-size="16" fill="#92400E" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">LDW</text>
<text x="720.0" y="170.0" font-size="10" fill="#475569" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">N cycles</text>
<circle cx="760.0" cy="300.0" r="50" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
<text x="760.0" y="302.0" font-size="16" fill="#4C1D95" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">MMUL</text>
<text x="760.0" y="320.0" font-size="10" fill="#475569" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">rows + 2N-1 cycles (v1)</text>
<circle cx="720.0" cy="450.0" r="50" fill="#D1FAE5" stroke="#059669" stroke-width="3"/>
<text x="720.0" y="452.0" font-size="16" fill="#065F46" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">ACT</text>
<text x="720.0" y="470.0" font-size="10" fill="#475569" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">rows cycles</text>
<circle cx="430.0" cy="480.0" r="50" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/>
<text x="430.0" y="482.0" font-size="16" fill="#1E293B" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">HALT</text>
<text x="430.0" y="500.0" font-size="10" fill="#475569" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">done = 1</text>
<path d="M405 255 C 360 180, 500 180, 455 255" stroke="#DC2626" stroke-width="2.2" fill="none" marker-end="url(#aR)" stroke-dasharray="6 4"/>
<text x="430.0" y="186.0" font-size="12" fill="#DC2626" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">v2: stall while a hazard is pending</text>
</svg>
